name: Publish bot container

on:
  push:
    branches: [main]
    # A GitHub release such as v1.2.0 publishes 1.2.0 and 1.2 image tags for
    # people who pin a version. Path filters do not apply to tag pushes.
    tags: ["v*.*.*"]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - ".github/workflows/publish-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One queue per branch or tag, so a release build cannot cancel a main build.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  # Every published image reaches the NAS automatically, so never publish
  # a commit that fails linting or tests.
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # main → latest; every build → full commit ID (used for rollback);
      # release v1.2.3 → 1.2.3 and 1.2 (the second picks up 1.2.x fixes).
      - name: Choose image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish ARM64 and AMD64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
