services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/shannenlolol/health-tracker:latest}
    env_file: .env
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: health_tracker
      POSTGRES_USER: health_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Optional database viewer in the browser. Never starts unless asked for:
  #   sudo docker compose -p health-tracker --profile adminer up -d adminer
  # Reachable only on your home network; don't port-forward it on the router.
  adminer:
    image: adminer:6.2.0@sha256:400af848ac3f57938abde4867677df1b195674d232c8896a27d111d04b9c088c
    profiles: ["adminer"]
    restart: "no"
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db
  updater:
    # Pinned (tag and digest) because it controls Docker on the NAS through
    # docker.sock. Dependabot proposes updates; Watchtower never updates itself.
    image: nickfedor/watchtower:1.23.2@sha256:62fb91130ddb493f869cad7e198fa260dd16c5da293ed092cbd5d8781566f7a6
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
