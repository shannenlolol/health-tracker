services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/shannenlolol/health-tracker:latest}
    env_file: .env
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: health_tracker
      POSTGRES_USER: health_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Optional database viewer in the browser. Never starts unless asked for:
  #   sudo docker compose -p health-tracker --profile adminer up -d adminer
  # Reachable only on your home network; don't port-forward it on the router.
  adminer:
    image: adminer:6.1.2@sha256:49a7d30e71de97fb18933ffe7d46cc2b343c49fd7a63a7791c8be2548eb65115
    profiles: ["adminer"]
    restart: "no"
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db
  updater:
    # Pinned (tag and digest) because it controls Docker on the NAS through
    # docker.sock. Dependabot proposes updates; Watchtower never updates itself.
    image: nickfedor/watchtower:1.23.1@sha256:3175c006eb20112f3a70f7002f82dbf4a4078c97e7033735a4d153668fc3dfb1
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
