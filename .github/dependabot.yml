version: 2

# Weekly update pull requests, grouped so each ecosystem opens at most one.
# The Tests workflow runs on every pull request; merge only when it passes,
# because merging to main publishes to the NAS automatically.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # A new PostgreSQL major version cannot read the existing data folder;
      # it needs a dump and restore, so upgrade it by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker-base-image:
        patterns: ["*"]
