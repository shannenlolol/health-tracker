name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by the publish workflow so an image is built only after tests pass.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Dockerfile's base image.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest
